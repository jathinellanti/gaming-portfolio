    <script>
      // Apply the saved theme before first paint so there is no flash.
      (function () {
        var t = "dark";
        try {
          var s = JSON.parse(localStorage.getItem("jp.settings.v1") || "null");
          if (s && s.data && (s.data.theme === "light" || s.data.theme === "dark")) t = s.data.theme;
        } catch (e) {}
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      })();
    </script>
  </head>
  <body class="grain">
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui">

  </body>
